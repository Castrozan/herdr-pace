name: checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check Python formatting and lint
        run: nix develop --command bash -c 'ruff check herdr_pace tests tools && ruff format --check herdr_pace tests tools'
      - name: Build package and run tests
        if: ${{ !cancelled() }}
        run: nix build --print-build-logs
